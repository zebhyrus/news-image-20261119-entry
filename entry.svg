<text x="271" y="968" text-anchor="middle" class="sans" font-size="15" fill="#333333">The game unlocks at midnight local time on PS5 and Xbox.</text>
<text x="271" y="986" text-anchor="middle" class="sans" font-size="15" fill="#333333">Millions waited for Rockstar&#8217;s return to Vice City.</text>
