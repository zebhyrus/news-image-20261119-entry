<text x="512" y="556" text-anchor="middle" class="serif" font-size="44" font-weight="bold" fill="#111111">Three nuclear powers meet</text>
<text x="512" y="600" text-anchor="middle" class="serif" font-size="44" font-weight="bold" fill="#111111">at one table in Shenzhen</text>
<text x="512" y="636" text-anchor="middle" class="sans" font-size="20" fill="#333333">Trump, Xi and Putin hold their first trilateral talks, on nuclear</text>
<text x="512" y="662" text-anchor="middle" class="sans" font-size="20" fill="#333333">arms, Iran and Ukraine. No deal is expected from the brief meeting.</text>
