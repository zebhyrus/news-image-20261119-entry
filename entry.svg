<text x="512" y="778" text-anchor="middle" class="serif" font-size="23" font-weight="bold" fill="#111111">Anthropic debuts on</text>
<text x="512" y="802" text-anchor="middle" class="serif" font-size="23" font-weight="bold" fill="#111111">Nasdaq in record IPO</text>
<text x="512" y="826" text-anchor="middle" class="sans" font-size="15" fill="#333333">Priced at $83 a share, the $81.3bn</text>
<text x="512" y="844" text-anchor="middle" class="sans" font-size="15" fill="#333333">sale is the largest listing on record.</text>
