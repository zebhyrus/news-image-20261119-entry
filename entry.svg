<text x="836" y="826" text-anchor="middle" class="sans" font-size="15" fill="#333333">50,000 people evacuated in Odisha;</text>
<text x="836" y="844" text-anchor="middle" class="sans" font-size="15" fill="#333333">landfall is forecast for Friday.</text>
