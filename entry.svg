<text x="188" y="802" text-anchor="middle" class="serif" font-size="23" font-weight="bold" fill="#111111">Rohingya genocide case</text>
<text x="188" y="826" text-anchor="middle" class="sans" font-size="15" fill="#333333">The Hague delivers its judgment in</text>
<text x="188" y="844" text-anchor="middle" class="sans" font-size="15" fill="#333333">The Gambia v. Myanmar, filed in 2019.</text>
